<!-- chatgpt fixture page v2 — current image-only assistant turn with an estuary asset -->
<style>
  [class*="imagegen-image"] {
    position: relative;
    width: 256px;
    height: 256px;
    overflow: hidden;
  }

  [class*="imagegen-image"] img {
    display: block;
    width: 256px;
    height: 256px;
  }

  [class*="imagegen-image"] img[aria-hidden="true"] {
    position: absolute;
    inset: 0;
  }

  [aria-label="Download"] {
    position: absolute;
    right: 8px;
    bottom: 8px;
  }
</style>
<section data-turn-id="user-1" data-testid="conversation-turn-1" data-turn="user">
  <div data-message-author-role="user">
    <div class="whitespace-pre-wrap">A red fox in the snow</div>
  </div>
</section>
<section data-turn-id="assistant-1" data-testid="conversation-turn-2" data-turn="assistant">
  <div data-conversation-screenshot-content>
    <!-- biome-ignore lint/a11y/useSemanticElements: Models ChatGPT's clickable image-card DOM around native action buttons. -->
    <div
      class="group/imagegen-image"
      role="button"
      tabindex="0"
      onclick="document.body.dataset.viewerOpened = 'true'"
      onkeydown="if (event.key === 'Enter') document.body.dataset.viewerOpened = 'true'"
    >
      <img
        id="generated-image"
        src="https://chatgpt.com/backend-api/estuary/content?id=file_fox&amp;sig=signed"
        alt="已生成图片：雪中的红狐"
      />
      <img
        aria-hidden="true"
        src="https://chatgpt.com/backend-api/estuary/content?id=file_fox&amp;sig=signed"
      />
      <button type="button" aria-label="编辑图片">Edit</button>
      <button type="button" aria-label="Download">Download</button>
    </div>
  </div>
</section>

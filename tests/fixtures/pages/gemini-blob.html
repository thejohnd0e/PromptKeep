<user-query data-turn-id="1">
  <div class="query-text">
    <h5 class="cdk-visually-hidden screen-reader-user-query-label">
      <span>You said</span> A watercolor lighthouse
    </h5>
    <p class="query-text-line">A watercolor lighthouse</p>
  </div>
</user-query>
<model-response data-turn-id="2">
  <button type="button" aria-label="Open generated image">
    <img id="blob-generated" class="image animate loaded" alt=", AI generated" />
  </button>
  <button id="gemini-download" type="button" aria-label="Download full size image"></button>
</model-response>
<script>
  const previewBytes = Uint8Array.from([137,80,78,71,13,10,26,10,0,0,0,13,73,72,68,82,0,0,0,8,0,0,0,8,8,6,0,0,0,196,15,190,139,0,0,0,18,73,68,65,84,120,156,99,56,33,96,240,31,31,102,24,25,10,0,211,70,129,193,148,187,95,240,0,0,0,0,73,69,78,68,174,66,96,130])
  document.getElementById("blob-generated").src = URL.createObjectURL(new Blob([previewBytes], { type: "image/png" }))

  function imageBlob(width, height, color, type = "image/png") {
    const canvas = document.createElement("canvas")
    canvas.width = width
    canvas.height = height
    const context = canvas.getContext("2d")
    context.fillStyle = color
    context.fillRect(0, 0, width, height)
    return new Promise((resolve) => canvas.toBlob(resolve, type))
  }

  document.getElementById("gemini-download").addEventListener("click", async () => {
    const sandboxDownload = new URL(location.href).searchParams.has("sandbox")
    if (sandboxDownload) {
      URL.createObjectURL(new Blob([previewBytes], { type: "image/png" }))
      await new Promise((resolve) => setTimeout(resolve, 6000))
    }
    const blob = await imageBlob(
      sandboxDownload ? 1792 : 96,
      sandboxDownload ? 2400 : 160,
      "#d2a12a",
      sandboxDownload ? "image/jpeg" : "image/png",
    )
    if (sandboxDownload) {
      const frame = document.createElement("iframe")
      frame.setAttribute("sandbox", "allow-scripts allow-downloads")
      const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }))
      frame.srcdoc = `<script>
        window.onmessage = (event) => {
          const port = event.ports[0]
          port.onmessage = (request) => {
            const link = document.createElement("a")
            link.href = URL.createObjectURL(request.data.values[0])
            link.download = request.data.values[1]
            document.body.appendChild(link)
            link.click()
            request.ports[0].postMessage({ result: undefined })
          }
        }
      <${"/"}script>`
      document.body.appendChild(frame)
      await loaded
      const channel = new MessageChannel()
      frame.contentWindow.postMessage(null, "*", [channel.port1])
      const reply = new MessageChannel()
      const completed = new Promise((resolve) => {
        reply.port1.onmessage = resolve
      })
      channel.port2.postMessage({
        code: 'var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();',
        paramNames: ["blob", "filename"],
        values: [blob, "Gemini_Generated_Image_fixture.jpg"],
      }, [reply.port2])
      await completed
      document.getElementById("gemini-download").dataset.completed = "true"
      channel.port2.close()
      reply.port1.close()
      frame.remove()
      return
    }
    const link = document.createElement("a")
    link.href = URL.createObjectURL(blob)
    link.download = "Gemini_Generated_Image_fixture.png"
    link.click()
  })
</script>
